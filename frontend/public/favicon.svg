<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B251E"/>
      <stop offset="100%" stop-color="#5B1410"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E67324"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente oficial de MISINCOL -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Emblema de la 'M' Misionera estilizada con cumbre dorada -->
  <g filter="url(#shadow)">
    <!-- Pierna izquierda -->
    <path d="M14 47V21c0-1.66 1.34-3 3-3h1.8c1.1 0 2.12.6 2.65 1.56L32 38.5l10.55-18.94c.53-.96 1.55-1.56 2.65-1.56H47c1.66 0 3 1.34 3 3v26c0 1.66-1.34 3-3 3s-3-1.34-3-3V29.2l-8.62 15.48c-.68 1.22-1.97 1.98-3.38 1.98s-2.7-0.76-3.38-1.98L20 29.2V47c0 1.66-1.34 3-3 3s-3-1.34-3-3z" fill="#FFFFFF"/>
    
    <!-- Vértice y cruz central con acento dorado/naranja -->
    <circle cx="32" cy="18" r="3.5" fill="url(#accentGrad)"/>
    <path d="M30 18h4M32 15v6" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
